<div class="task-carousel" data-task-carousel role="region" aria-roledescription="carousel" aria-label="{% if zh %}MetaFine 官方任务演示{% else %}MetaFine official task demonstrations{% endif %}">
  <div class="task-carousel-track" id="metafine-task-track" tabindex="0" aria-label="{% if zh %}左右滑动或使用方向键切换任务{% else %}Swipe or use arrow keys to switch tasks{% endif %}">
    {% for demo in competition.demos %}
    <figure class="task-slide" role="group" aria-roledescription="slide" aria-label="{{ forloop.index }} / {{ competition.demos.size }}">
      <video id="metafine-demo-{{ demo.id }}" data-task-demo muted loop playsinline controls preload="none" poster="{{ demo.poster | relative_url }}" aria-label="{% if zh %}{{ demo.description_zh }}{% else %}{{ demo.description_en }}{% endif %}">
        <source src="{{ demo.video | relative_url }}" type="video/mp4">
        <a href="{{ demo.video | relative_url }}">{% if zh %}查看操作演示{% else %}Watch the task demonstration{% endif %}</a>
      </video>
      <figcaption>{% if zh %}{{ demo.title_zh }}{% else %}{{ demo.title_en }}{% endif %}</figcaption>
    </figure>
    {% endfor %}
  </div>
  <div class="carousel-controls" hidden>
    <button class="demo-toggle" type="button" aria-controls="metafine-demo-{{ competition.demos | map: 'id' | join: ' metafine-demo-' }}" aria-pressed="false" hidden>{% if zh %}播放{% else %}Play{% endif %}</button>
    <div class="carousel-pagination">
      <button class="carousel-prev" type="button" aria-controls="metafine-task-track" aria-label="{% if zh %}上一个任务{% else %}Previous task{% endif %}"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="m10 3-5 5 5 5" stroke="currentColor" stroke-width="1.4"/></svg></button>
      <span class="carousel-count" aria-live="polite" aria-atomic="true">1 / {{ competition.demos.size }}</span>
      <button class="carousel-next" type="button" aria-controls="metafine-task-track" aria-label="{% if zh %}下一个任务{% else %}Next task{% endif %}"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="m6 3 5 5-5 5" stroke="currentColor" stroke-width="1.4"/></svg></button>
    </div>
  </div>
  <p class="media-credit">{% if zh %}任务示意：{% else %}Task illustrations: {% endif %}<a href="{{ competition.competition_url }}">MetaFine {% if zh %}主办方{% else %}organizers{% endif %}</a></p>
</div>
