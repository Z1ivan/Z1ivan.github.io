    <figure class="certificate-figure">
      <a class="certificate-preview" href="{{ competition.certificate | relative_url }}" data-certificate-open aria-haspopup="dialog" aria-label="{% if zh %}放大查看获奖证书{% else %}View Team MAI's champion certificate{% endif %}">
        <img src="{{ competition.certificate_image | relative_url }}" alt="{% if zh %}MAI 团队的 MetaFine 比赛冠军证书{% else %}MetaFine Open Competition champion certificate for Team MAI, listing Lifan Zheng first{% endif %}" width="1800" height="1273" loading="lazy" decoding="async">
      </a>
      <figcaption><a href="{{ competition.certificate | relative_url }}" data-certificate-open aria-haspopup="dialog">{% if zh %}查看获奖证书{% else %}View champion certificate{% endif %}</a><span>{% if zh %}点击放大{% else %}Click to enlarge{% endif %}</span></figcaption>
