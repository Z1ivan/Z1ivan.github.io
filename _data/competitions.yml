  summary_en: "Evaluation-guided demonstration refinement for fine-grained robot manipulation."
  summary_zh: "分析机器人操作中的失误，改进训练 VLA 模型所用的示范数据。"
  detail_en: "We fine-tuned a separate VLA policy for each of the five competition tasks. Local evaluation guided demonstration revision and expert continuations from policy-reached states, while checkpoint selection checked performance across instructions."
  detail_zh: "我们针对五个任务分别微调 VLA 模型。回看本地评测中的失败片段后，我们调整示范动作，并补充模型出错后如何继续完成任务的专家示范。选择模型时，我们会比较各条指令的评测结果，检查模型是否在某些指令上反而退步。"
